title: Navigation
actions:
  - label: New Navigation Item
    modalRoute: cms.navigation.detail
    modalComponent: cms::navigation-detail
defaultSort:
  field: sort_order
  direction: asc
notSortableColumns:
  - page_name
disableSearch: false
columns:
  - field: name
    label: Name
    type: coloredText
  - field: navigation_key
    label: Key
  - field: page_name
    label: Page
  - field: link
    label: Link
  - field: sort_order
    label: Sort position
    width: 0.5
  - field: new_tab
    label: 'New Tab'
    type: bool
