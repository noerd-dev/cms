key: contact
title: Contact Form
description: 'General contact form for customer enquiries'
sendEmail: true
emailSubject: 'New contact request from {{field:name}}'
emailBody: |
  <h2>New contact request</h2>
  <p><strong>Name:</strong> {{field:name}}</p>
  <p><strong>Email:</strong> {{field:email}}</p>
  <p><strong>Phone:</strong> {{field:phone}}</p>
  <p><strong>Message:</strong><br>{{field:message}}</p>
  <hr>
  <p><small>Sent on {{submission_date}}</small></p>
sendConfirmation: true
confirmationField: email
confirmationSubject: 'Thank you for your message'
confirmationBody: |
  <p>Hello {{field:name}},</p>
  <p>thank you for your message. We will get back to you soon.</p>
fields:
  - name: name
    label: Name
    type: text
    required: true
    validation:
      - string
      - 'max:255'
    errorMessages:
      required: 'The name is required.'
    placeholder: 'Your full name'
  - name: email
    label: Email
    type: email
    required: true
    validation:
      - email
      - 'max:255'
    errorMessages:
      required: 'The email address is required.'
      email: 'Please enter a valid email address.'
    placeholder: you@example.com
  - name: phone
    label: Phone
    type: tel
    validation:
      - string
      - 'max:255'
    placeholder: '+49 ...'
  - name: message
    label: Message
    type: textarea
    required: true
    rows: 4
    validation:
      - string
      - 'max:2000'
    errorMessages:
      required: 'Please enter a message.'
    placeholder: 'Your message to us...'
successMessage: 'Thank you! Your message has been sent successfully. We will get back to you soon.'
submitButtonText: 'Send message'
