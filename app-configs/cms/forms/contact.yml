key: contact
title: Contact Form
description: 'General contact form for customer enquiries'
send_email: true
fields:
  - name: name
    label: Name
    type: text
    required: true
    validation:
      - required
      - string
      - 'max:255'
    error_messages:
      required: 'The name is required.'
    placeholder: 'Your full name'
  - name: email
    label: Email
    type: email
    required: true
    validation:
      - required
      - email
      - 'max:255'
    error_messages:
      required: 'The email address is required.'
      email: 'Please enter a valid email address.'
    placeholder: you@example.com
  - name: phone
    label: Phone
    type: tel
    required: false
    validation:
      - nullable
      - string
      - 'max:255'
    placeholder: '+49 ...'
  - name: message
    label: Message
    type: textarea
    required: true
    rows: 4
    validation:
      - required
      - string
      - 'max:2000'
    error_messages:
      required: 'Please enter a message.'
    placeholder: 'Your message to us...'
success_message: 'Thank you! Your message has been sent successfully. We will get back to you soon.'
submit_button_text: 'Send message'
