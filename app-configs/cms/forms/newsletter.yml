key: newsletter
title: Newsletter Signup
description: 'Form for newsletter subscriptions'
send_email: true
email_subject: 'Newsletter signup: {{field:email}}'
email_body: |
  <h2>New newsletter signup</h2>
  <p><strong>Email:</strong> {{field:email}}</p>
  <p><strong>Name:</strong> {{field:name}}</p>
  <hr>
  <p><small>Signed up on {{submission_date}}</small></p>
notification_email: newsletter@example.com
fields:
  - name: email
    label: Email address
    type: email
    required: true
    validation:
      - required
      - email
      - 'max:255'
    error_messages:
      required: 'Please enter your email address.'
      email: 'Please enter a valid email address.'
    placeholder: you@example.com
  - name: name
    label: 'Name (optional)'
    type: text
    required: false
    validation:
      - nullable
      - string
      - 'max:255'
    placeholder: 'Your name'
success_message: 'Thank you! You have successfully subscribed to our newsletter.'
submit_button_text: 'Subscribe now'
