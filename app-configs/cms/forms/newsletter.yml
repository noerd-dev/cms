key: newsletter
title: Newsletter Signup
description: 'Form for newsletter subscriptions'
sendEmail: true
emailSubject: 'Newsletter signup: {{field:email}}'
emailBody: |
  <h2>New newsletter signup</h2>
  <p><strong>Email:</strong> {{field:email}}</p>
  <p><strong>Name:</strong> {{field:name}}</p>
  <hr>
  <p><small>Signed up on {{submission_date}}</small></p>
notificationEmail: newsletter@example.com
sendConfirmation: true
confirmationField: email
confirmationSubject: 'Welcome to our newsletter'
confirmationBody: |
  <p>Hello {{field:name}},</p>
  <p>thank you for subscribing to our newsletter.</p>
fields:
  - name: email
    label: Email address
    type: email
    required: true
    validation:
      - email
      - 'max:255'
    errorMessages:
      required: 'Please enter your email address.'
      email: 'Please enter a valid email address.'
    placeholder: you@example.com
  - name: name
    label: 'Name (optional)'
    type: text
    validation:
      - string
      - 'max:255'
    placeholder: 'Your name'
successMessage: 'Thank you! You have successfully subscribed to our newsletter.'
submitButtonText: 'Subscribe now'
