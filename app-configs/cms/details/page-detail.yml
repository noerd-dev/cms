title: ''
description: ''
tabs:
  - number: 1
    label: General
  - number: 2
    label: Metadata
fields:
  - type: block
    title: Page Info
    tab: 1
    fields:
      - name: detailData.name
        label: Title
        type: translatableText
        colspan: 5
      - name: detailData.slug
        label: URL
        type: translatableText
        colspan: 5
      - name: detailData.is_active
        label: 'Active?'
        type: checkbox
        colspan: 2
  - type: block
    title: Layout Settings
    tab: 1
    fields:
      - name: detailData.layout
        label: Layout
        type: picklist
        picklistField: layoutOptions
        colspan: 12
  - type: block
    title: SEO Metadata
    tab: 2
    fields:
      - name: detailData.meta_title
        label: Meta Title
        type: translatableText
        colspan: 6
      - name: detailData.meta_description
        label: Meta Description
        type: translatableText
        colspan: 6
      - name: detailData.og_image
        label: Open Graph Image
        type: image
        colspan: 6
      - name: detailData.meta_noindex
        label: Exclude from search engines (noindex)
        type: checkbox
        colspan: 6
