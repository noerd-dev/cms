title: ''
description: ''
tabs:
  - { number: 1, label: 'Allgemein' }
  - { number: 2, label: 'Metadaten' }
fields:
  # Tab 1: Allgemein
  - type: block
    title: 'Seiteninfos'
    tab: 1
    fields:
      - { name: model.name, label: Title, type: translatableText, colspan: 5 }
      - { name: model.slug, label: URL, type: translatableText, colspan: 5 }
      - { name: model.is_active, label: cms_label_is_active, type: checkbox, colspan: 2 }
  - type: block
    title: 'Layout Einstellungen'
    tab: 1
    fields:
      - { name: model.layout, label: Layout, type: picklist, picklistField: layoutOptions, colspan: 12 }
  # Tab 2: Metadaten
  - type: block
    title: 'SEO Metadaten'
    tab: 2
    fields:
      - { name: model.meta_title, label: 'Meta Titel', type: translatableText, colspan: 6 }
      - { name: model.meta_description, label: 'Meta Beschreibung', type: translatableText, colspan: 6 }
